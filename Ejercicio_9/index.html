<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Mirador Ensueño</title>
    <link rel="stylesheet" href="./css/styles.css">

<html lang="es">

<main class="form-page">

    <section class="form-section">

        <div class="form-container">
            
            <div class="theme-container">

                <input type="radio" name="tema" id="light-theme" value="claro" checked>

                <label for="light-theme">Claro ☀︎</label>

                <input type="radio" name="tema" id="dark-theme" value="oscuro">

                <label for="dark-theme">Oscuro ⏾</label>

            </div>

            <header class="form-header">

                <span class="eyebrow">
                    CONTACTANOS
                </span>

                <h1>
                    Mirador Ensueño
                </h1>

                <p>
                    Ven los mejores paisajes del país, desde el mejor punto y con la mejor comida de la ciudad <br>
                    Complete el formulario para asistir. Los campos marcados con
                    <strong>*</strong> son obligatorios.
                </p>

            </header>

            <form class="contact-form" action="#" method="post">

                <!-- DATOS PERSONALES -->

                <section class="form-block">

                    <h2>
                        Datos personales
                    </h2>

                    <div class="form-grid">

                        <div class="form-field">

                            <label for="nombre">
                                Nombre
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>

                            <input type="text"
                            id="nombre"
                            name="nombre"
                            autocomplete="given-name"
                            placeholder="Laura"
                                required>

                        </div>

                        <div class="form-field">

                            <label for="apellido">
                                Apellido
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>

                            <input type="text"
                            id="apellido"
                            name="apellido"
                            autocomplete="family-name"
                            placeholder="España"
                            required>

                        </div>

                    </div>


                    <div class="form-grid">

                        <div class="form-field">

                            <label for="email">
                                Correo
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>

                            <input type="email" id="email" name="email" autocomplete="email"
                                placeholder="nombre@email.com" required>

                        </div>

                        <div class="form-field">

                            <label for="telefono">
                                Teléfono
                            </label>

                            <input type="tel" id="telefono" name="telefono" autocomplete="tel"
                                placeholder="+57 300 000 0000">

                        </div>

                    </div>

                </section>

                <section class="form-block">

                    <div class="form-field">

                        <label for="acompañantes">
                            Número de acompañantes
                        </label>

                        <input type="number"
                        id="acompañantes"
                        name="acompañantes"
                        min="1"
                        max="20"
                        step="1" 
                        placeholder="0">

                        <small class="field-help">Máximo 20 acompañantes</small>

                    </div>


                </section>

                <!-- AGENDA -->

                <section class="form-block">

                    <h2>
                        Fecha de asistencia
                    </h2>

                    <div class="form-grid">

                        <div class="form-field">

                            <label for="fecha">
                                Fecha preferida
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>

                            <input type="date"
                            id="fecha"
                            name="fecha"
                            required>

                        </div>

                        <div class="form-field">

                            <label for="hora">
                                Hora preferida
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>

                            <input type="time"
                            id="hora"
                            name="hora"
                            required>

                        </div>

                    </div>

                </section>


                <!-- MENSAJE -->

                <div class="form-field">

                    <label for="mensaje">
                        Información adicional
                    </label>

                    <textarea id="mensaje"
                    name="mensaje"
                    rows="7"
                    maxlength="1200"
                    placeholder="Cuéntanos tus solicitudes o inquitudes "></textarea>

                    <small class="field-help">
                        Máximo 1200 caracteres.
                    </small>

                </div>

                <!-- TÉRMINOS -->

                <label class="choice">
                    <input type="checkbox"
                    name="terminos"
                    required>

                    <span>
                        Acepto el tratamiento de la información
                        suministrada.
                    </span>
                </label>


                <!-- BOTONES -->

                <div class="form-actions">

                    <button type="submit" class="button button-primary">
                        Enviar solicitud
                    </button>

                    <button type="reset" class="button button-secondary">
                        Limpiar
                    </button>

                </div>

            </form>

        </div>

    </section>

</main>
