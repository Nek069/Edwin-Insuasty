<!-- APLICACION DE OPTGROUP PARA DEPARTAMENTOS Y SERVICIOS -->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CODA · Contacto</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <main class="form-page">

        <section class="form-section">

            <div class="form-container">

                <header class="form-header">

                    <span class="eyebrow">
                        CONTACTO
                    </span>

                    <h1>
                        CODA, Soluciones Especializadas
                    </h1>
                    <p>
                        ¿Necesitas ayuda?, contactanos y te ayudamos. <br>
                        Complete el formulario. Los campos marcados con
                        <strong>*</strong> son obligatorios.
                    </p>

                </header>

                <form class="contact-form" action="#" method="post">

                    <!-- DATOS PERSONALES -->

                    <section class="form-block">

                        <h2>
                            Datos personales
                        </h2>

                        <div class="form-grid">

                            <div class="form-field">

                                <label for="nombre">
                                    Nombre
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>

                                <input type="text" id="nombre" name="nombre" autocomplete="given-name"
                                    placeholder="Ryan" required>

                            </div>

                            <div class="form-field">

                                <label for="apellido">
                                    Apellido
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>

                                <input type="text" id="apellido" name="apellido" autocomplete="family-name"
                                    placeholder="Mejiro" required>

                            </div>

                        </div>


                        <div class="form-grid">

                            <div class="form-field">

                                <label for="email">
                                    Correo
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>

                                <input type="email" id="email" name="email" autocomplete="email"
                                    placeholder="nombre@empresa.com" required>

                            </div>

                            <div class="form-field">

                                <label for="telefono">
                                    Teléfono
                                </label>

                                <input type="tel" id="telefono" name="telefono" autocomplete="tel"
                                    placeholder="+57 300 000 0000">

                            </div>

                        </div>

                    </section>


                    <!-- ORGANIZACIÓN -->

                    <section class="form-block">

                        <h2>
                            Organización
                        </h2>

                        <div class="form-field">

                            <label for="empresa">
                                Empresa
                            </label>

                            <input type="text" id="empresa" name="empresa" autocomplete="organization"
                                placeholder="Anticheat S.A.S.">

                        </div>

                        <div class="form-field">

                            <label for="departamento">
                                Departamento a contactar
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>

                            <select id="departamento" name="departamento" required>

                                <option value="" selected disabled>
                                    Seleccione un departamento
                                </option>

                                <optgroup label="Comercial">

                                    <option value="ventas">
                                        Ventas
                                    </option>

                                    <option value="atencion-cliente">
                                        Atención al Cliente
                                    </option>

                                </optgroup>

                                <optgroup label="Técnico">

                                    <option value="soporte">
                                        Soporte Técnico
                                    </option>

                                    <option value="desarrollo">
                                        Desarrollo de Software
                                    </option>

                                </optgroup>

                                <optgroup label="Administrativo">

                                    <option value="rrhh">
                                        Recursos Humanos
                                    </option>

                                    <option value="facturacion">
                                        Facturación y Pagos
                                    </option>

                                </optgroup>

                            </select>

                        </div>


                        <div class="form-field">

                            <label for="servicio">
                                Servicio de interés
                                <span class="required-mark" aria-hidden="true">*</span>
                            </label>

                            <select id="servicio" name="servicio" required>

                                <option value="" selected disabled>
                                    Seleccione un servicio
                                </option>

                                <optgroup label="Auditorías de Seguridad">

                                    <option value="pentesting">
                                        Pentesting
                                    </option>

                                    <option value="hacking-etico">
                                        Hacking Ético
                                    </option>

                                    <option value="iso27001">
                                        ISO 27001
                                    </option>

                                </optgroup>

                                <optgroup label="Desarrollo Seguro">

                                    <option value="ssdlc">
                                        SSDLC
                                    </option>

                                    <option value="devsecops">
                                        DevSecOps
                                    </option>

                                    <option value="ai-security">
                                        AI Security
                                    </option>

                                </optgroup>

                            </select>

                        </div>

                    </section>

                    <!-- AGENDA -->

                    <section class="form-block">

                        <h2>
                            Disponibilidad
                        </h2>

                        <div class="form-grid">

                            <div class="form-field">

                                <label for="fecha">
                                    Fecha preferida
                                </label>

                                <input type="date" id="fecha" name="fecha">

                            </div>

                            <div class="form-field">

                                <label for="hora">
                                    Hora preferida
                                </label>

                                <input type="time" id="hora" name="hora">

                            </div>

                        </div>

                    </section>


                    <!-- MODALIDAD -->


                    <div class="form-field">

                        <label for="servicio">
                            Como contactarte
                            <span class="required-mark" aria-hidden="true">*</span>
                        </label>

                        <select id="modalidad" name="modalidad" required>

                            <option value="" selected disabled>
                                Seleccione una modalidad
                            </option>

                            <optgroup label="Contacto escrito">

                                <option value="correo">
                                    Correo electrónico
                                </option>

                            </optgroup>

                            <optgroup label="Contacto en tiempo real">

                                <option value="telefono">
                                    Teléfono
                                </option>

                                <option value="videollamada">
                                    Videollamada
                                </option>

                            </optgroup>

                        </select>

                    </div>


                    <!-- INTERESES -->

                    <fieldset>

                        <legend>
                            Temas adicionales de interés
                        </legend>

                        <div class="choice-list">

                            <label class="choice">
                                <input type="checkbox" name="intereses" value="seguridad">
                                <span>Seguridad de aplicaciones</span>
                            </label>

                            <label class="choice">
                                <input type="checkbox" name="intereses" value="cloud">
                                <span>Cloud Security</span>
                            </label>

                            <label class="choice">
                                <input type="checkbox" name="intereses" value="ia">
                                <span>AI Security</span>
                            </label>

                        </div>

                    </fieldset>


                    <!-- MENSAJE -->

                    <div class="form-field">

                        <label for="mensaje">
                            Describa su necesidad
                            <span class="required-mark" aria-hidden="true">*</span>
                        </label>

                        <textarea id="mensaje" name="mensaje" rows="7" maxlength="1200"
                            placeholder="Cuéntenos brevemente qué necesita..." required></textarea>

                        <small class="field-help">
                            Máximo 1200 caracteres.
                        </small>

                    </div>


                    <!-- ARCHIVO -->

                    <div class="form-field">

                        <label for="archivo">
                            Documento de soporte <small class="option">(Si lo necesita)</small>
                        </label>

                        <input type="file" id="archivo" name="archivo" accept=".pdf,.doc,.docx,.xlsx">

                        <small class="field-help">
                            Formatos sugeridos: PDF, Word o Excel.
                        </small>

                    </div>


                    <!-- TÉRMINOS -->
                    <label class="information">
                        <span>Lee los
                            <a href="#">Terminos</a> y
                            <a href="#">Condiciones de Privacidad</a>
                            asociados
                        </span>
                    </label>

                    <label class="choice">
                        <input type="checkbox" name="terminos" required>

                        <span>
                            Acepto el tratamiento de la información
                            suministrada.
                        </span>
                    </label>


                    <!-- BOTONES -->

                    <div class="form-actions">

                        <button type="submit" class="button button-primary">
                            Enviar solicitud
                        </button>

                        <button type="reset" class="button button-secondary">
                            Limpiar
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

</body>

</html>
